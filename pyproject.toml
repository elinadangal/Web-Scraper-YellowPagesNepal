[project]
name = "yellowpages-scraper"
version = "0.1.0"
description = "A web scraper for YellowPages Nepal built with Crawl4AI"
readme = "README.md"
authors = [
    { name = "elinadangal", email = "elinadangal09@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crawl4ai>=0.9.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "json-repair>=0.63.4",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
